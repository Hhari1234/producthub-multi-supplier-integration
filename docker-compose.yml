version: '3.9'

services:
  db:
    image: postgres:17-alpine
    container_name: producthub-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-producthub}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d producthub"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: producthub-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://postgres:postgres@db:5432/producthub}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
    container_name: producthub-frontend
    depends_on:
      - backend
    ports:
      - "4173:4173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1

volumes:
  pgdata:
